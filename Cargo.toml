[package]
name = "wren"
version = "0.3.0"
edition = "2021"
description = "Wren - A lightweight Linux-style command-line compatibility shell for Windows, written in Rust."
authors = ["Wren contributors"]
default-run = "wren"

[[bin]]
name = "wren"
path = "src/main.rs"

# 独立的 Windows 桌面应用：固定状态栏 + 多标签终端（本地 / WSL / SSH）
[[bin]]
name = "wren-app"
path = "src/bin/wren-app/main.rs"

[dependencies]
# 行编辑 / 历史 / Tab 补全，让交互体验接近 bash/readline
rustyline = { version = "14", features = ["with-file-history"] }
# 跨平台彩色输出
colored = "2"
# 桌面窗口与即时模式界面
eframe = "0.31"
egui = "0.31"
# 终端仿真内核（ConPTY / VT100），供 wren-app 使用
alacritty_terminal = "0.25"
anyhow = "1"
open = "5"
# 本地系统状态采集
sysinfo = "0.33"
# 配置持久化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地时间、远程时钟偏差
chrono = "0.4"
ico = "0.3"

[profile.release]
opt-level = 2
strip = true
